<div class="card shadow-sm" style="max-width: 400px; margin: 2rem auto;">
  <div class="card-body">
    <h3 class="card-title mb-4">Login</h3>
    <form (ngSubmit)="login()">
      @if (error) {
      <div class="alert alert-danger py-2 small mb-3">
        {{error}}
      </div>
      }
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" [(ngModel)]="email" name="email" class="form-control" placeholder="Enter email" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" [(ngModel)]="password" name="password" class="form-control" placeholder="Enter password"
          required>
      </div>
      <div class="d-grid">
        <button type="submit" class="btn btn-primary" [disabled]="loading">
          @if (loading) {
          <span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
          }
          Login
        </button>
      </div>
    </form>
  </div>
</div>
